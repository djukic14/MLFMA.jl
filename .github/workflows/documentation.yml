name: Documentation

on:
  push:
    branches:
      - main
    tags: '*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JULIA_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'

jobs:
  build:
    permissions:
      actions: write
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - name: Install dependencies
        shell: julia --startup-file=no --color=yes {0}
        env:
          JULIA_PKG_PRECOMPILE_AUTO: '0'
        run: |
          using Pkg
          workspace = ENV["GITHUB_WORKSPACE"]
          Pkg.activate(joinpath(workspace, "docs"))
          Pkg.develop(Pkg.PackageSpec(; path=workspace))
          Pkg.instantiate()
      - name: Build and deploy
        shell: julia --startup-file=no --project=docs --color=yes {0}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
        run: include(joinpath(ENV["GITHUB_WORKSPACE"], "docs", "make.jl"))
