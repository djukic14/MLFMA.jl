[compat]
AutoHashEquals = "2"
BEAST = "2"
ClusterTrees = "0.2"
CompScienceMeshes = "0.11, 0.12, 1.0"
Dictionaries = "0.3, 0.4"
FFTW = "1"
FastGaussQuadrature = "0.5, 1"
# H2Factory sits at `0.1.0-DEV`, and `"0.1"` MATCHES it.
#
# THE REASON THIS ENTRY USED TO BE ABSENT WAS WRONG. The old comment claimed a prerelease does not
# satisfy a caret bound, so `H2Factory = "1"` would put the only available version below its own floor
# and make the package unresolvable. Measured against the installed Pkg, that is false:
# `v"1.0.0-DEV" in Pkg.Types.semver_spec("1")` is `true`, as is
# `v"0.1.0-DEV" in semver_spec("0.1")`. `semver_spec` admits prereleases of its lower bound. The
# version ORDERING the old comment cited (`v"1.0.0-DEV" < v"1.0.0"`) is real but is not what compat
# membership uses -- which is why iFMM's long-standing `H2Factory = "1"` was never actually broken.
#
# `"0.1"` is also the only spelling available: `"0.1.0-DEV"`, `"=0.1.0-DEV"` and `">=0.1.0-DEV"` are
# all invalid compat specifiers under this Pkg.
H2Factory = "0.1"
H2Trees = "0.4"
JuliaFormatter = "=2.12.4"
LinearAlgebra = "1"
OhMyThreads = "0.8"
Random = "1"
SparseArrays = "1"
SpecialFunctions = "2"
StaticArrays = "1"
# H2FactoryTestUtils at "0.1", the bound whose absence was flagged here as needing justification.
# It became writable only now: the package sat at `1.0.0-DEV` with no tags, and `"0.1"` does NOT
# admit that, so the bound could not exist before the version moved to `0.1.0-DEV`. Measured against
# the installed Pkg rather than assumed: `v"0.1.0-DEV" in Pkg.Types.semver_spec("0.1")` is true,
# `v"1.0.0-DEV" in semver_spec("0.1")` is false. `"0.1"` is also the only legal spelling, since
# `"0.1.0-DEV"` and `"=0.1.0-DEV"` are both rejected as specifiers.
H2FactoryTestUtils = "0.1"
# H2Factory and H2FactoryTestUtils require Julia 1.11; CI tests this floor.
julia = "1.11"

[extras]
GmshTools = "82e2f556-b1bd-5f1a-9576-f93c0da5f0ee"
