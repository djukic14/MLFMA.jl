[deps]
BEAST = "bb4162c7-ba94-5a20-af32-d8ec4428bdd1"
BenchmarkTools = "6e4b80f9-dd63-53aa-95a3-0cdb28fa8baf"
CompScienceMeshes = "3e66a162-7b8c-5da0-b8f8-124ecd2c3ae1"
H2Factory = "15a95800-2d86-4c02-ab0d-b887130f60ac"
H2Trees = "9db26ae3-82ff-4374-85e9-9ed87405fd16"
InteractiveUtils = "b77e0a4c-d291-57a0-90e8-8db25a27a240"
LinearAlgebra = "37e2e46d-f89d-539d-b4ee-838fcccc9c8e"
MLFMA = "5d3e0d49-91a8-4e6e-b908-b05782274a43"
Random = "9a3f8284-a2c9-5f02-9a11-845980a1fd5c"
StaticArrays = "90137ffa-7385-5640-81b9-e52037218182"

# Path sources for the packages developed alongside MLFMA. MLFMA and H2Factory are not in any
# reachable registry, and H2Trees is developed locally too, so without these the environment cannot
# resolve at all -- and if H2Trees resolved from the registry instead, the benchmarks would measure a
# different H2Trees than the test suite runs against.
[sources]
H2Factory = {path = "../../H2Factory"}
H2Trees = {path = "../../H2Trees"}
MLFMA = {path = ".."}
